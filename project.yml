# XcodeGen spec (CI runs `xcodegen generate`; the .xcodeproj is not committed).
name: Proxy
options:
  bundleIdPrefix: dev.de0ch
  deploymentTarget: { iOS: "16.0" }
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: S64YL394S3
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "$(BUILD_NUMBER)"
    BUILD_NUMBER: "1"
    SWIFT_VERSION: "5.9"
packages:
  ProxyCore: { path: Packages/ProxyCore }
targets:
  Proxy:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Bundled/**"]
      - path: App/Bundled/Subscriptions
        type: folder
        buildPhase: resources
    dependencies:
      - package: ProxyCore
      - target: PacketTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.de0ch.proxy
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Proxy
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSRequiresIPhoneOS: true
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes: ["Rules/**"]
      - path: PacketTunnel/Rules
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Libbox.xcframework
        embed: false
      - sdk: libresolv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.de0ch.proxy.tunnel
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS: ["-ObjC"]
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: Proxy Tunnel
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"
  ProxyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Proxy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.de0ch.proxy.uitests
        TEST_TARGET_NAME: Proxy
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Proxy:
    build:
      targets: { Proxy: all, ProxyUITests: [test] }
    test:
      targets: [ProxyUITests]
